name: GCP Docker Deployment

on:
  push:
    branches:
      - private

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set Environment Variables
        run: |
          echo "VM_IP=${{ secrets.DEV_VM_IP }}" >> $GITHUB_ENV
          echo "PRIVATE_IP=${{ secrets.PRIVATE_VM_IP }}" >> $GITHUB_ENV

      - name: Add SSH Key
        run: |
          echo "${{ secrets.GCP_SSH_KEY }}" > key.pem
          chmod 600 key.pem
          echo "${{ secrets.PRIVATE_SSH_KEY }}" > keyprivate.pem
          chmod 600 keyprivate.pem

      - name: Deploy to Private VM via Public VM
        run: |
          ssh -o StrictHostKeyChecking=no -i key.pem ${{ secrets.VM_SSH_USER }}@$VM_IP << EOF
            echo "${{ secrets.PRIVATE_SSH_KEY }}" > keyprivate.pem
            chmod 600 keyprivate.pem

            PRIVATE_IP="${{ secrets.PRIVATE_VM_IP }}"
            SSH_USER="${{ secrets.VM_SSH_USER }}"
            REF_NAME="${{ github.ref_name }}"
            APP_ENV_FILE="${{ secrets.APP_ENV_FILE }}"

            ssh -o StrictHostKeyChecking=no -i keyprivate.pem \$SSH_USER@\$PRIVATE_IP bash << 'INNER_EOF'
              set -e
              echo "Cloning or updating the repo..."
              if [ ! -d "/home/$SSH_USER/app" ]; then
                git clone https://github.com/Manish-auriga/backend.git /home/$SSH_USER/app
              fi

              cd /home/$SSH_USER/app
              git fetch --all
              git checkout $REF_NAME
              git pull origin $REF_NAME
              echo "$APP_ENV_FILE" > .env
              sudo docker compose down || true
              sudo docker compose up -d --build
            INNER_EOF
          EOF

name: GCP Docker Deployment

on:
  push:
    branches:
      - dev

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set Environment Variables
        run: |
            echo "VM_IP=${{ secrets.DEV_VM_IP }}" >> $GITHUB_ENV
          

      - name: Add SSH Key
        run: |
          echo "${{ secrets.GCP_SSH_KEY }}" > key.pem
          chmod 600 key.pem

      - name: Deploy to VM via SSH
        run: |
          ssh -o StrictHostKeyChecking=no -i key.pem ${{ secrets.VM_SSH_USER }}@$VM_IP << 'EOF'
            cd /home/${{ secrets.VM_SSH_USER }}/app || git clone https://github.com/Manish-auriga/backend.git app && cd app
            git fetch --all
            git checkout ${{ github.ref_name }}
            git pull origin ${{ github.ref_name }}
            echo "${{ secrets.APP_ENV_FILE }}" > .env
            chmod +x ./automate.sh
            ./automate.sh
            # docker compose down
            # docker compose up -d --build
            # docker ps -a

            # echo "=== docker compose ps ==="
            # docker compose ps

            # # If any container exited, grab its last 50 lines of logs:
            # for c in $(docker ps -aq --filter "status=exited"); do
            #   echo "=== logs for $c ==="
            #   docker logs --tail 50 $c
            # done
          EOF
      
